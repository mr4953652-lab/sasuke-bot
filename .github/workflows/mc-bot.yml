name: Minecraft Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: minecraft-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run bot
        env:
          MC_HOST: mc.havencraft.pro
          MC_PORT: '2566'
          MC_USERNAME: SASUKE_440
          MC_LOGIN_CMD: ${{ secrets.MC_LOGIN_CMD }}
        run: node bot.js
